<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ソフトウェア設計のNote｜紹介中の記事</title>
<meta name="description" content="ショート動画・Instagramで紹介した記事の一覧です。">
<style>
:root { --bg:#121c30; --card:#1b2742; --fg:#f5f6fa; --sub:#aab6cc; --acc:#ffc43d; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif; }
main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
header { border-top:6px solid var(--acc); padding-top:20px; margin-bottom:20px; }
h1 { font-size:20px; margin:0 0 6px; }
header p { color:var(--sub); font-size:14px; margin:0; line-height:1.6; }
a.card { display:flex; gap:14px; align-items:center; background:var(--card); border-radius:14px;
  padding:12px; margin:12px 0; color:inherit; text-decoration:none; }
a.card:first-of-type { outline:2px solid var(--acc); }
.card img { width:96px; height:120px; object-fit:cover; border-radius:8px; flex:none; }
.date { color:var(--acc); font-size:12px; font-weight:bold; }
.title { font-size:15px; font-weight:bold; line-height:1.5; margin:4px 0 6px; }
.go { color:var(--sub); font-size:13px; }
.all { display:block; text-align:center; margin-top:24px; padding:14px; border-radius:12px;
  background:var(--acc); color:#121c30; font-weight:bold; text-decoration:none; }
</style>
</head>
<body>
<main>
<header>
<h1>ソフトウェア設計のNote</h1>
<p>動画・Instagramで紹介した記事です。いちばん上が最新です。</p>
</header>
<p style="color:var(--sub)">準備中です。</p>
<a class="all" href="https://note.com/rosy_flax9582">Noteのすべての記事を見る</a>
</main>
</body>
</html>
